name: Update streaming collections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-and-deploy.yml'

permissions:
  contents: write

concurrency:
  group: odin-collections-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh provider collections
        env:
          COUNTRY: US
          LANGUAGE: en
          TARGET: '750'
          RECENT_TARGET: '300'
          PAGE_SIZE: '100'
          REQUEST_DELAY_MS: '120'
        run: node scripts/update.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/movie v2/meta/movie
          if ! git diff --cached --quiet; then
            git commit -m "Refresh streaming collections"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Purge jsDelivr branch cache
        continue-on-error: true
        run: |
          paths=(
            "manifest.json"
            "catalog/movie/streaming-collections.json"
            "v2/manifest.json"
            "v2/catalog/movie/streaming-collections-v2.json"
            "meta/movie/odincol.netflix.json"
            "meta/movie/odincol.prime.json"
            "meta/movie/odincol.disney.json"
            "meta/movie/odincol.max.json"
            "meta/movie/odincol.apple.json"
            "meta/movie/odincol.paramount.json"
            "meta/movie/odincol.peacock.json"
            "meta/movie/odincol.hulu.json"
            "meta/movie/odincol.crunchyroll.json"
            "v2/meta/movie/odincol2.netflix.json"
            "v2/meta/movie/odincol2.prime.json"
            "v2/meta/movie/odincol2.disney.json"
            "v2/meta/movie/odincol2.hbomax.json"
            "v2/meta/movie/odincol2.apple.json"
            "v2/meta/movie/odincol2.paramount.json"
            "v2/meta/movie/odincol2.peacock.json"
            "v2/meta/movie/odincol2.hulu.json"
            "v2/meta/movie/odincol2.crunchyroll.json"
          )
          for path in "${paths[@]}"; do
            echo "Purging $path"
            curl --fail --silent --show-error --retry 2 \
              "https://purge.jsdelivr.net/gh/rinongit/odin-collections@main/${path}" >/dev/null || true
          done
