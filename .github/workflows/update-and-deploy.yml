name: Update streaming collections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-and-deploy.yml'

permissions:
  contents: write

concurrency:
  group: odin-collections-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh provider collections
        env:
          COUNTRY: US
          LANGUAGE: en
          LIMIT: '100'
        run: node scripts/update.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/movie v2/meta/movie
          if ! git diff --cached --quiet; then
            git commit -m "Refresh streaming collections"
            git pull --rebase origin main
            git push origin main
          fi
