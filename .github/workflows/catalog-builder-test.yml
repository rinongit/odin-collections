name: Catalog Builder Test

on:
  push:
    paths:
      - 'catalog-builder/**'
      - '.github/workflows/catalog-builder-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
