name: Apply catalog builder credentials patch

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch-catalog-builder-credentials.py
      - scripts/patch-catalog-builder-credentials.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-catalog-builder-credentials.py
      - name: Install dependencies
        working-directory: catalog-builder
        run: npm install
      - name: Check server syntax
        working-directory: catalog-builder
        run: node --check server.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-builder/server.mjs catalog-builder/configure.html catalog-builder/package.json catalog-builder/package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add API credential profiles to catalog builder"
            git pull --rebase origin main
            git push
          fi
